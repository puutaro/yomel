name: Release

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      raw_version: ${{ steps.get_version.outputs.raw_version }}
      tag_version: ${{ steps.get_version.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from yomel.toml
        id: get_version
        run: |
          RAW_VERSION=$(python3 -c '
          import sys
          if sys.version_info >= (3, 11):
              import tomllib
          else:
              import tomli as tomllib
          with open("yomel.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["yomel"]["version"])
          ')
          TAG_VERSION="v${RAW_VERSION}"

          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_ENV
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

          echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: macos
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macos
            arch: arm64
            goos: darwin
            goarch: arm64
    env:
      RAW_VERSION: ${{ needs.setup.outputs.raw_version }}
      TAG_VERSION: ${{ needs.setup.outputs.tag_version }}
      BUILD_DIR: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go generate ./...
          mkdir -p ${{ env.BUILD_DIR }}
          BINARY_NAME="yomel_${{ env.TAG_VERSION }}_${{ matrix.goos }}_${{ matrix.arch }}"
          go build -ldflags="-s -w -X main.version=${{ env.TAG_VERSION }}" -o "${{ env.BUILD_DIR }}/${BINARY_NAME}" ./cmd/yomel/main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.BUILD_DIR }}/*
          if-no-files-found: error

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RAW_VERSION: ${{ needs.setup.outputs.raw_version }}
      TAG_VERSION: ${{ needs.setup.outputs.tag_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check release note existence
        id: check_release_note
        run: |
          NOTE_PATH="releasenote/${{ env.RAW_VERSION }}.md"
          if [ -f "$NOTE_PATH" ]; then
            echo "NOTE_PATH=$NOTE_PATH" >> $GITHUB_ENV
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-binaries

      - name: Flatten artifacts directory
        run: |
          mkdir -p final_build
          find downloaded-binaries -type f -exec mv {} final_build/ \;

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: final_build/*
          tag_name: ${{ env.TAG_VERSION }}
          name: Release yomel-${{ env.TAG_VERSION }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force update release note body with markdown file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTE_PATH="releasenote/${{ env.RAW_VERSION }}.md"
          if [ -f "$NOTE_PATH" ]; then
            echo "Overwriting release note body using $NOTE_PATH"
            gh release edit "${{ env.TAG_VERSION }}" --notes-file "$NOTE_PATH"
          else
            echo "Release note file ($NOTE_PATH) not found."
            exit 1
          fi