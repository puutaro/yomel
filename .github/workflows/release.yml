name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: macos
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macos
            arch: arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version from yomel.toml
        id: get_version
        run: |
          RAW_VERSION=$(python3 -c '
          import sys
          if sys.version_info >= (3, 11):
              import tomllib
          else:
              import tomli as tomllib
          with open("yomel.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["yomel"]["version"])
          ')
          
          TAG_VERSION="v${RAW_VERSION}"
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go generate ./...
          mkdir -p ${{ env.BUILD_DIR }}
          BINARY_NAME="yomel_${{ env.TAG_VERSION }}_${{ matrix.goos }}_${{ matrix.arch }}"
          
          go build -ldflags="-s -w -X main.version=${{ env.TAG_VERSION }}" -o "${{ env.BUILD_DIR }}/${BINARY_NAME}" ./cmd/yomel/main.go

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILD_DIR }}/*
          tag_name: ${{ env.TAG_VERSION }}
          name: Release ${{ env.TAG_VERSION }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}